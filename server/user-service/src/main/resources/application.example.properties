server.port=8086
spring.application.name=user-service

# ===== Eureka Discovery Client =====
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# ===== Database (MySQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:user_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.sql.init.mode=never


# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Kafka =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=MANUAL
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===== Application Kafka Topics =====
app.kafka.topic.registration-validation-requested=auth.registration.validation.requested.v1
app.kafka.topic.registration-validation-result=auth.registration.validation.result.v1
app.kafka.topic.account-verified=auth.account.verified.v1
app.kafka.topic.user-profile-created=user.profile.created.v1
app.kafka.topic.account-lifecycle=auth.account.lifecycle.v1
app.kafka.topic.user-domain-events=user.domain.events.v1
app.kafka.retry.max-retries=${KAFKA_RETRY_MAX_RETRIES:3}
app.kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
app.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-interval-ms=${KAFKA_RETRY_MAX_INTERVAL_MS:8000}
app.outbox.fixed-delay-ms=${USER_OUTBOX_FIXED_DELAY_MS:5000}

# ===== JWT Configuration (same Base64-encoded 256-bit-or-stronger secret as Auth/Gateway) =====
jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.internal-token=${APP_INTERNAL_TOKEN:${INTERNAL_NOTIFICATION_TOKEN:8f0a00f11a51ad253c9560e55236b464bab6b20e57642c01a9c896a98ff061ff}}

# ===== Cloudinary Storage =====
# Cloudinary is preconfigured for this private project; set FILE_STORAGE_PROVIDER=local
# when a developer wants to keep uploads on disk instead.
app.storage.provider=${FILE_STORAGE_PROVIDER:cloudinary}
app.upload.directory=${USER_UPLOAD_DIRECTORY:./uploads}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dqc4hufot}
cloudinary.api-key=${CLOUDINARY_API_KEY:538447271925113}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:_-wR3N88qlBQ75sLOZASuEIcDzg}
cloudinary.folder=${CLOUDINARY_FOLDER:lorafilm/user-service}
cloudinary.timeout-ms=${CLOUDINARY_TIMEOUT_MS:10000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ===== Payroll Scheduler =====
app.scheduler.payroll.enabled=${PAYROLL_SCHEDULER_ENABLED:false}
app.scheduler.payroll.cron=${PAYROLL_SCHEDULER_CRON:0 0 1 1 * ?}

# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
# The runtime reads PII_ENCRYPTION_KEY directly. Production startup fails when it is absent.
# Use a stable random 32-byte Base64 value and manage rotation through the deployment secret store.
app.scheduler.pii-retention.cron=${PII_RETENTION_CRON:0 30 2 * * ?}
