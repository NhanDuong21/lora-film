###############################################
# BOOKING SERVICE - APPLICATION CONFIGURATION #
###############################################

server.port=8083
spring.application.name=booking-service

# ===== Eureka Discovery Client =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3307/booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_database_password
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=your_redis_password
spring.data.redis.database=0
spring.data.redis.timeout=60000

# ===== Logging =====
logging.level.org.springframework.web=INFO
logging.level.com.project.bookingservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===== Booking Module Properties =====
booking.reservation.ttl-seconds=300
booking.redis.lock.ttl-seconds=300
booking.idempotency.ttl-hours=24

# ===== Security (JWT) =====
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

#Test mockdata movie-service url
spring.profiles.active=local

# ===== Expiration Worker Properties =====
booking.expiration-worker.enabled=true
booking.expiration-worker.fixed-delay-ms=30000
booking.expiration-worker.batch-size=100
booking.seat-reservation-ttl-minutes=5
booking.payment-timeout-minutes=15

# ===== Pagination Guardrails =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.one-indexed-parameters=false

# ===== JSON Formatting & Timezone =====
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# ===== Internal API Token =====
internal.api.token=your-secret-internal-token