# ============================================================
# BOOKING SERVICE CONFIGURATION EXAMPLE
# Copy this file to application.properties and update the credentials
# ============================================================

spring.application.name=booking-service

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson Configuration
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# Server Port Configuration
server.port=${SERVER_PORT:8083}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.internal-token=${APP_INTERNAL_TOKEN:secret-internal-token}
# Dedicated authority for Payment context/result/refund endpoints. Configure a
# distinct value outside local development.
app.internal-payment-token=${PAYMENT_TO_BOOKING_INTERNAL_TOKEN:${APP_INTERNAL_TOKEN:secret-internal-token}}
services.movie-service.url=${MOVIE_SERVICE_URL:http://localhost:8082}

# Swagger OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Booking Code Configuration
booking.code-time-zone=${BOOKING_CODE_TIME_ZONE:Asia/Ho_Chi_Minh}
booking.max-seats-per-booking=${BOOKING_MAX_SEATS_PER_BOOKING:8}
booking.hold-duration-seconds=${BOOKING_HOLD_DURATION_SECONDS:900}
booking.creation-lock-ttl-seconds=${BOOKING_CREATION_LOCK_TTL_SECONDS:30}

# Realtime seat availability (Socket.IO runs on a separate local port and is
# reached through the Gateway /socket.io/** WebSocket route).
booking.realtime.enabled=${BOOKING_REALTIME_ENABLED:true}
booking.realtime.host=${BOOKING_REALTIME_HOST:0.0.0.0}
booking.realtime.port=${BOOKING_REALTIME_PORT:9093}
booking.realtime.allowed-origin=${BOOKING_REALTIME_ALLOWED_ORIGIN:http://localhost:5173}

# Logging Configuration
logging.level.com.lorafilm.booking=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true
