# ============================================================
# BOOKING SERVICE CONFIGURATION EXAMPLE
# Copy this file to application.properties and update the credentials
# ============================================================

spring.application.name=booking-service

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:booking_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# JPA & Hibernate Configuration
# The canonical SQL file owns this schema; Hibernate must only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Jackson Configuration
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# Server Port Configuration
server.port=${SERVER_PORT:8083}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Security Configuration
jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.internal-token=${APP_INTERNAL_TOKEN:${INTERNAL_NOTIFICATION_TOKEN:8f0a00f11a51ad253c9560e55236b464bab6b20e57642c01a9c896a98ff061ff}}
services.movie-service.internal-token=${BOOKING_TO_MOVIE_INTERNAL_TOKEN:${APP_INTERNAL_TOKEN:${INTERNAL_NOTIFICATION_TOKEN:8f0a00f11a51ad253c9560e55236b464bab6b20e57642c01a9c896a98ff061ff}}}
user.service.base-url=${USER_SERVICE_URL:http://localhost:8086}
user.service.internal-token=${BOOKING_TO_USER_INTERNAL_TOKEN:${APP_INTERNAL_TOKEN:8f0a00f11a51ad253c9560e55236b464bab6b20e57642c01a9c896a98ff061ff}}
user.service.read-timeout=${USER_SERVICE_READ_TIMEOUT:3000}
# Dedicated authority for Payment context/result/refund endpoints. Configure a
# distinct value outside local development.
app.internal-payment-token=${PAYMENT_TO_BOOKING_INTERNAL_TOKEN:payment-booking-local-token}
services.movie-service.url=${MOVIE_SERVICE_URL:http://localhost:8082}
# Legacy seat-layout client still consumes this key. Keep both Movie client
# properties aligned until that client is consolidated.
movie.service.url=${MOVIE_SERVICE_URL:http://localhost:8082}
services.score-service.url=${SCORE_SERVICE_URL:http://localhost:8088}
services.score-service.internal-token=${BOOKING_TO_SCORE_INTERNAL_TOKEN:${APP_INTERNAL_TOKEN:dev-internal-token}}
# Must match promotion-service's app.internal-auth.booking-service-token.
services.promotion-service.url=${PROMOTION_SERVICE_URL:http://localhost:8087}
services.promotion-service.internal-token=${PROMOTION_BOOKING_SERVICE_TOKEN:booking-service-local-token}
app.internal-promotion-audit-token=${PROMOTION_TO_BOOKING_INTERNAL_TOKEN}
booking.ticket-access-base-url=${TICKET_ACCESS_BASE_URL:http://localhost:5173/tickets}

# Swagger OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Booking Code Configuration
booking.code-time-zone=${BOOKING_CODE_TIME_ZONE:Asia/Ho_Chi_Minh}
booking.max-seats-per-booking=${BOOKING_MAX_SEATS_PER_BOOKING:8}
booking.hold-duration-seconds=${BOOKING_HOLD_DURATION_SECONDS:900}
booking.creation-lock-ttl-seconds=${BOOKING_CREATION_LOCK_TTL_SECONDS:30}
booking.ticket-scan.operations-zone=${BOOKING_TICKET_SCAN_OPERATIONS_ZONE:Asia/Ho_Chi_Minh}
booking.ticket-scan.open-before-minutes=${BOOKING_TICKET_SCAN_OPEN_BEFORE_MINUTES:30}

# Kafka outbox publisher
booking.kafka.enabled=${BOOKING_KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.producer.properties.request.timeout.ms=10000
booking.kafka.domain-topic=${BOOKING_DOMAIN_TOPIC:booking.domain.events.v1}
booking.kafka.events-topic=${BOOKING_EVENTS_TOPIC:booking.events.v1}
booking.kafka.cancelled-topic=${BOOKING_CANCELLED_TOPIC:booking.booking-cancelled.v1}
booking.kafka.promotion-consumer-enabled=${BOOKING_PROMOTION_CONSUMER_ENABLED:true}
booking.kafka.promotion-lifecycle-topic=${PROMOTION_LIFECYCLE_TOPIC:promotion.lifecycle}
booking.kafka.promotion-group-id=${BOOKING_PROMOTION_GROUP_ID:booking-promotion-reconciliation-v1}
booking.promotion-reconciliation.fixed-delay-ms=${BOOKING_PROMOTION_RECONCILIATION_DELAY_MS:60000}
booking.promotion-reconciliation.mismatch-alert-threshold=${BOOKING_PROMOTION_RECONCILIATION_MISMATCH_ALERT_THRESHOLD:1}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Realtime seat availability (Socket.IO runs on a separate local port and is
# reached through the Gateway /socket.io/** WebSocket route).
booking.realtime.enabled=${BOOKING_REALTIME_ENABLED:true}
booking.realtime.host=${BOOKING_REALTIME_HOST:0.0.0.0}
booking.realtime.port=${BOOKING_REALTIME_PORT:9093}
booking.realtime.allowed-origin=${BOOKING_REALTIME_ALLOWED_ORIGIN:http://localhost:5173}

# Concession product images. The catalog can still use an HTTPS image URL when
# Cloudinary local development account; environment variables may override it.
cloudinary.cloud-name=${BOOKING_CLOUDINARY_CLOUD_NAME:dqc4hufot}
cloudinary.api-key=${BOOKING_CLOUDINARY_API_KEY:538447271925113}
cloudinary.api-secret=${BOOKING_CLOUDINARY_API_SECRET:_-wR3N88qlBQ75sLOZASuEIcDzg}
cloudinary.folder=${BOOKING_CLOUDINARY_FOLDER:lorafilm/foods}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:6MB}

# Logging Configuration
logging.level.com.lorafilm.booking=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.defaults.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true

# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
