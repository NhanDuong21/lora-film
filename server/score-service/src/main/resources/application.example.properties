server.port=8088
spring.application.name=score-service

# ===== Eureka Discovery Client =====
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# ===== Database (MySQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:score_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Security (JWT) =====
jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
jwt.expiration=86400000
app.internal-token=${APP_INTERNAL_TOKEN:${INTERNAL_NOTIFICATION_TOKEN:secret-internal-token}}

# ===== Booking Service integration =====
clients.booking-service.base-url=${BOOKING_SERVICE_URL:http://localhost:8083}
clients.booking-service.internal-token=${SCORE_TO_BOOKING_INTERNAL_TOKEN:${APP_INTERNAL_TOKEN:secret-internal-token}}

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Score Configuration =====
score.redemption.value-per-point=1000

# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# ===== Kafka =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

# Booking confirmation consumer
score.kafka.booking-events-consumer.enabled=${SCORE_BOOKING_EVENTS_CONSUMER_ENABLED:true}
score.kafka.booking-events-consumer.group-id=${SCORE_BOOKING_EVENTS_CONSUMER_GROUP:score-service-booking-confirmed-v1}
score.kafka.booking-events-consumer.concurrency=${SCORE_BOOKING_EVENTS_CONSUMER_CONCURRENCY:1}
score.kafka.booking-events-topic=${BOOKING_EVENTS_TOPIC:booking.events.v1}
score.kafka.booking-events-dlt-topic=${BOOKING_EVENTS_DLT_TOPIC:booking.events.v1.DLT}

# ===== Actuator & Metrics =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=score-service

# ===== Outbox & Rate Limiting =====
score.outbox.poll-interval=5000
score.ratelimit.enabled=true
score.ratelimit.requests-per-minute=60

