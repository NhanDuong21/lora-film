# ===== Database (H2 In-Memory) =====
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Security (JWT) =====
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.internal-auth.booking-service-token=test-booking-service-token
app.internal-auth.payment-service-token=test-payment-service-token
app.internal-auth.operations-service-token=test-operations-service-token
promotion.booking-service.internal-token=promotion-booking-test-token
promotion.payment-service.internal-token=promotion-payment-assessment-test-token

# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.client.enabled=false
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
