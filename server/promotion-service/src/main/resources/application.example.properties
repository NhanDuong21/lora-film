spring.application.name=promotion-service
server.port=8087

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:promotion_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# Apply docs/database/mysql/promotion-service-schema.sql before startup.
# Hibernate validates the schema and never creates or mutates tables.
spring.jpa.hibernate.ddl-auto=validate

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=promotion-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:30000}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}

# Security & JWT
jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.internal-auth.booking-service-token=${PROMOTION_BOOKING_SERVICE_TOKEN:booking-service-local-token}
app.internal-auth.payment-service-token=${PROMOTION_PAYMENT_SERVICE_TOKEN:payment-service-local-token}
app.internal-auth.operations-service-token=${PROMOTION_OPERATIONS_SERVICE_TOKEN:operations-service-local-token}
promotion.user-service.url=${USER_SERVICE_URL:http://localhost:8086}
promotion.user-service.internal-token=${USER_SERVICE_INTERNAL_TOKEN:${APP_INTERNAL_TOKEN:${INTERNAL_NOTIFICATION_TOKEN:dev-internal-token}}}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.defaults.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.project.promotionservice=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO

# App Scheduling
app.scheduling.enable=true
promotion.reservation.distributed-lock-enabled=${PROMOTION_RESERVATION_DISTRIBUTED_LOCK_ENABLED:true}
promotion.reservation.lock-ttl-seconds=${PROMOTION_RESERVATION_LOCK_TTL_SECONDS:30}
promotion.reservation.lock-wait-ms=${PROMOTION_RESERVATION_LOCK_WAIT_MS:1000}
promotion.reservation.expiration-delay-ms=${PROMOTION_RESERVATION_EXPIRATION_DELAY_MS:30000}
promotion.monitoring.refresh-delay-ms=${PROMOTION_MONITORING_REFRESH_DELAY_MS:60000}
promotion.monitoring.expiration-backlog-alert-threshold=${PROMOTION_EXPIRATION_BACKLOG_ALERT_THRESHOLD:100}
promotion.monitoring.oldest-expired-age-alert-seconds=${PROMOTION_OLDEST_EXPIRED_AGE_ALERT_SECONDS:120}
promotion.monitoring.reversal-hourly-alert-threshold=${PROMOTION_REVERSAL_HOURLY_ALERT_THRESHOLD:10}
promotion.monitoring.budget-exposure-alert-ratio=${PROMOTION_BUDGET_EXPOSURE_ALERT_RATIO:0.98}
promotion.idempotency.processing-lease-seconds=${PROMOTION_IDEMPOTENCY_PROCESSING_LEASE_SECONDS:120}
promotion.idempotency.retention-hours=${PROMOTION_IDEMPOTENCY_RETENTION_HOURS:24}
promotion.outbox.batch-size=${PROMOTION_OUTBOX_BATCH_SIZE:50}
promotion.outbox.lease-seconds=${PROMOTION_OUTBOX_LEASE_SECONDS:60}
promotion.outbox.max-retries=${PROMOTION_OUTBOX_MAX_RETRIES:8}
promotion.outbox.kafka-ack-timeout-seconds=${PROMOTION_OUTBOX_KAFKA_ACK_TIMEOUT_SECONDS:10}
promotion.outbox.published-retention-days=${PROMOTION_OUTBOX_PUBLISHED_RETENTION_DAYS:7}
promotion.integration.event-retention-days=${PROMOTION_INTEGRATION_EVENT_RETENTION_DAYS:30}
promotion.scheduler.job-retention-days=${PROMOTION_SCHEDULER_JOB_RETENTION_DAYS:30}
promotion.runtime-retention-delay-ms=${PROMOTION_RUNTIME_RETENTION_DELAY_MS:3600000}
promotion.scheduler.lock-seconds=${PROMOTION_SCHEDULER_LOCK_SECONDS:300}
promotion.scheduler.lifecycle-delay-ms=${PROMOTION_SCHEDULER_LIFECYCLE_DELAY_MS:300000}
promotion.scheduler.promotion-expiration-delay-ms=${PROMOTION_SCHEDULER_PROMOTION_EXPIRATION_DELAY_MS:3600000}
promotion.integration.consumers-enabled=${PROMOTION_INTEGRATION_CONSUMERS_ENABLED:false}
promotion.integration.consume-topics=${PROMOTION_INTEGRATION_CONSUME_TOPICS:booking.events,payment.events,notification.events,score.events,movie.events}
promotion.integration.dlq-topics=${PROMOTION_INTEGRATION_DLQ_TOPICS:booking.events.dlq,payment.events.dlq,notification.events.dlq,score.events.dlq,movie.events.dlq}
promotion.integration.max-retries=${PROMOTION_INTEGRATION_MAX_RETRIES:5}
promotion.integration.processing-lease-seconds=${PROMOTION_INTEGRATION_PROCESSING_LEASE_SECONDS:120}
promotion.integration.retry-delay-ms=${PROMOTION_INTEGRATION_RETRY_DELAY_MS:30000}

# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
