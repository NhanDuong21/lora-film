server.port=8089
spring.application.name=analytics-service

# ===== Eureka Discovery Client =====
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE:analytics_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== Kafka =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${ANALYTICS_KAFKA_GROUP:analytics-service-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
analytics.kafka.listener-enabled=${ANALYTICS_KAFKA_LISTENER_ENABLED:true}
analytics.kafka.payment-success-topic=${PAYMENT_ANALYTICS_TOPIC:payment-success.v1}
analytics.kafka.payment-refund-topic=${PAYMENT_REFUND_ANALYTICS_TOPIC:payment-refunded.v1}
analytics.kafka.booking-cancelled-topic=${BOOKING_CANCELLED_TOPIC:booking.booking-cancelled.v1}

# ===== KPI pipeline =====
analytics.zone-id=${ANALYTICS_ZONE_ID:Asia/Ho_Chi_Minh}
analytics.scheduler.cron=${ANALYTICS_SCHEDULER_CRON:0 10 1 * * *}
analytics.scheduler.lookback-days=${ANALYTICS_LOOKBACK_DAYS:3}
analytics.scheduler.today-delay-ms=${ANALYTICS_TODAY_DELAY_MS:60000}
analytics.scheduler.today-initial-delay-ms=${ANALYTICS_TODAY_INITIAL_DELAY_MS:10000}
analytics.forecast.horizon-days=${ANALYTICS_FORECAST_HORIZON_DAYS:7}
analytics.anomaly.z-score-threshold=${ANALYTICS_ANOMALY_Z_SCORE_THRESHOLD:3.5}
analytics.anomaly.minimum-deviation=${ANALYTICS_ANOMALY_MINIMUM_DEVIATION:0.20}
analytics.jobs.pool-size=${ANALYTICS_JOBS_POOL_SIZE:2}
analytics.insight.revenue-drop-threshold=${ANALYTICS_REVENUE_DROP_THRESHOLD:0.20}
analytics.insight.refund-rate-threshold=${ANALYTICS_REFUND_RATE_THRESHOLD:0.10}
analytics.insight.low-occupancy-threshold=${ANALYTICS_LOW_OCCUPANCY_THRESHOLD:0.25}

# ===== Security (JWT) =====
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ===== Swagger (OpenAPI) =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# ===== Operations =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
