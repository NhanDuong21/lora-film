####################################################
# NOTIFICATION SERVICE - SAMPLE CONFIGURATION FILE #
####################################################
# Huong dan:
# 1) Copy file nay thanh application.properties
# 2) Dien gia tri thuc te theo moi truong local
# 3) Khong push application.properties len git

server.port=8085
spring.application.name=notification-service

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://localhost:3306/notification_db
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update | validate | create | create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
