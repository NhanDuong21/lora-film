# Copy this file to application.properties. Notification service runs as a local
# Java process and is intentionally not packaged by Docker.
server.port=${NOTIFICATION_SERVICE_PORT:8085}
server.max-http-request-header-size=16KB
spring.application.name=notification-service

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:notification_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
notification.kafka.enabled=${NOTIFICATION_KAFKA_ENABLED:true}
notification.kafka.booking-topic=${NOTIFICATION_BOOKING_TOPIC:booking.domain.events.v1}
notification.kafka.user-topic=${NOTIFICATION_USER_TOPIC:user.domain.events.v1}
notification.kafka.payment-topic=${NOTIFICATION_PAYMENT_TOPIC:payment.domain.events.v1}
notification.kafka.promotion-topic=${NOTIFICATION_PROMOTION_TOPIC:promotion.lifecycle}
notification.user-service.url=${USER_SERVICE_URL:http://localhost:8086}
notification.user-service.internal-token=${USER_SERVICE_INTERNAL_TOKEN:${INTERNAL_NOTIFICATION_TOKEN:dev-internal-token}}
notification.frontend-base-url=${FRONTEND_URL:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:lorafirm.system@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ynpgsiciggzlikxz}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}


notification.git.remote-uri=${NOTIFICATION_TEMPLATE_GIT_URI:https://github.com/vinhth05/temple-mail.git}
notification.git.working-directory=${NOTIFICATION_TEMPLATE_GIT_WORKDIR:${user.home}/.lorafilm/template-registry}
notification.git.published-branch=${NOTIFICATION_TEMPLATE_GIT_BRANCH:main}
notification.git.username=${NOTIFICATION_TEMPLATE_GIT_USERNAME:}
notification.git.access-token=${NOTIFICATION_TEMPLATE_GIT_TOKEN:}
notification.git.author-name=${NOTIFICATION_TEMPLATE_GIT_AUTHOR:LoraFilm Notification Service}
notification.git.author-email=${NOTIFICATION_TEMPLATE_GIT_AUTHOR_EMAIL:notifications@lorafilm.local}
notification.git.max-template-bytes=${NOTIFICATION_TEMPLATE_MAX_BYTES:200000}
notification.git.fetch-timeout-seconds=${NOTIFICATION_TEMPLATE_GIT_TIMEOUT_SECONDS:15}
notification.git.auto-refresh-enabled=${NOTIFICATION_TEMPLATE_AUTO_REFRESH_ENABLED:true}
notification.git.refresh-interval-ms=${NOTIFICATION_TEMPLATE_REFRESH_INTERVAL_MS:30000}
notification.git.refresh-initial-delay-ms=${NOTIFICATION_TEMPLATE_REFRESH_INITIAL_DELAY_MS:5000}

notification.delivery.from-address=${MAIL_FROM_ADDRESS:${spring.mail.username}}
notification.delivery.from-name=${MAIL_FROM_NAME:LoraFilm}
notification.delivery.worker-delay-ms=${NOTIFICATION_WORKER_DELAY_MS:5000}
notification.delivery.batch-size=${NOTIFICATION_WORKER_BATCH_SIZE:50}
notification.delivery.max-attempts=5
notification.delivery.rendered-content-max-bytes=500000
notification.delivery.subject-max-length=200
notification.delivery.sms-max-length=480
notification.delivery.mock-sms=true
notification.delivery.mock-web-push=true
notification.security.recipient-encryption-key=${NOTIFICATION_RECIPIENT_ENCRYPTION_KEY:${NOTIFICATION_PAYLOAD_ENCRYPTION_KEY:Pi0aDpf77gh4PCkZD42b2QuBHDcPM5aWxJFoCFG3/UE=}}
notification.security.internal-token=${INTERNAL_NOTIFICATION_TOKEN:8f0a00f11a51ad253c9560e55236b464bab6b20e57642c01a9c896a98ff061ff}
notification.security.allowed-origins=${NOTIFICATION_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
