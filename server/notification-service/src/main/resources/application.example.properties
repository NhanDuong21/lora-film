spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

resilience4j.circuitbreaker.instances.notificationProvider.sliding-window-size=20
resilience4j.circuitbreaker.instances.notificationProvider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notificationProvider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationProvider.wait-duration-in-open-state=30s
resilience4j.timelimiter.instances.notificationProvider.timeout-duration=10s
resilience4j.ratelimiter.instances.notificationProvider.limit-for-period=100
resilience4j.ratelimiter.instances.notificationProvider.limit-refresh-period=1s
resilience4j.bulkhead.instances.notificationProvider.max-concurrent-calls=20
