############################################
# AUTH SERVICE - SAMPLE CONFIGURATION FILE #
############################################
# Huong dan:
# 1) Copy file nay thanh application.properties
# 2) Dien gia tri thuc te theo moi truong local
# 3) Khong push application.properties len git

server.port=${SERVER_PORT:8081}
spring.application.name=auth-service

# ===== Eureka Discovery Client =====
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# ===== Database (MySQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:auth_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# ===== JPA / Hibernate =====
# validate | create | create-drop
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=false

spring.sql.init.mode=never
# ===== JWT Configuration (Base64-encoded secret, at least 256 bits before encoding) =====
jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.frontend.oauth2-redirect-url=${OAUTH2_REDIRECT_URL:http://localhost:5173/oauth2/redirect}

# ===== Downstream Services =====
cccd.api.url=${CCCD_API_URL:https://api-check-cccd.lorafilm.xyz/api/cccd/check}
cccd.api.key=${CCCD_API_KEY:lora_cccd_2026_secret}
cccd.api.connect-timeout=${CCCD_API_CONNECT_TIMEOUT:2s}
cccd.api.read-timeout=${CCCD_API_READ_TIMEOUT:5s}

# ===== CCCD Circuit Breaker =====
resilience4j.circuitbreaker.instances.cccdVerification.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.cccdVerification.sliding-window-size=${CCCD_CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.cccdVerification.minimum-number-of-calls=${CCCD_CB_MINIMUM_CALLS:5}
resilience4j.circuitbreaker.instances.cccdVerification.failure-rate-threshold=${CCCD_CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.cccdVerification.wait-duration-in-open-state=${CCCD_CB_OPEN_STATE_WAIT:30s}
resilience4j.circuitbreaker.instances.cccdVerification.permitted-number-of-calls-in-half-open-state=${CCCD_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.cccdVerification.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.cccdVerification.ignore-exceptions=com.project.authservice.exception.CccdException$InvalidCccdException
# RestTemplate connect/read timeouts bound the call without an asynchronous TimeLimiter wrapper.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

# ===== Kafka Producer & Consumer =====

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ===== Application Kafka Topics =====
app.kafka.topic.registration-validation-requested=auth.registration.validation.requested.v1
app.kafka.topic.registration-validation-result=auth.registration.validation.result.v1
app.kafka.topic.account-verified=auth.account.verified.v1
app.kafka.topic.account-lifecycle=auth.account.lifecycle.v1
app.kafka.topic.user-domain-events=user.domain.events.v1
app.kafka.topic.user-profile-created=user.profile.created.v1
app.kafka.topic.auth-domain=auth.domain.events.v1
app.kafka.retry.max-retries=${KAFKA_RETRY_MAX_RETRIES:3}
app.kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
app.kafka.retry.multiplier=${KAFKA_RETRY_MULTIPLIER:2.0}
app.kafka.retry.max-interval-ms=${KAFKA_RETRY_MAX_INTERVAL_MS:8000}

# ===== Application Security Configuration =====
app.security.default-roles=ADMIN,CUSTOMER

# Seed the built-in roles and permissions required by a clean database. Admin
# creation remains optional and only runs when both credentials are supplied.
app.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin-email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

# ===== Notification Service Integration =====
app.internal-token=${APP_INTERNAL_TOKEN:${INTERNAL_NOTIFICATION_TOKEN:8f0a00f11a51ad253c9560e55236b464bab6b20e57642c01a9c896a98ff061ff}}
app.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8085}
app.notification-service.delivery-wait-ms=${NOTIFICATION_DELIVERY_WAIT_MS:15000}
logging.level.org.springframework.web.client.RestTemplate=INFO
logging.level.org.springframework.web.HttpLogging=INFO




# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# ===== OAuth2 Client Configuration =====
# Create a Google OAuth 2.0 Web client and configure this exact authorized
# redirect URI: http://localhost:8080/login/oauth2/code/google
# The client ID and secret must belong to the same Google OAuth client.
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID:local-development-client-id}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET: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}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===== Redis =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
