############################################
# AUTH SERVICE - SAMPLE CONFIGURATION FILE #
############################################
# Huong dan:
# 1) Copy file nay thanh application.properties
# 2) Dien gia tri thuc te theo moi truong local
# 3) Khong push application.properties len git

server.port=8081
spring.application.name=auth-service

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:auth_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:movieuser}
spring.datasource.password=${MYSQL_PASSWORD:moviepassword}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update | validate | create | create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
