############################################
# AUTH SERVICE - SAMPLE CONFIGURATION FILE #
############################################
# Huong dan:
# 1) Copy file nay thanh application.properties
# 2) Dien gia tri thuc te theo moi truong local
# 3) Khong push application.properties len git

server.port=8081
spring.application.name=auth-service

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:auth_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate | create | create-drop
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
# ===== JWT Configuration =====
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ===== Downstream Services =====
cccd.api.url=REPLACE_WITH_CCCD_API_URL
cccd.api.key=REPLACE_WITH_CCCD_API_KEY

# ===== Kafka Producer & Consumer =====

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ===== Application Kafka Topics =====
app.kafka.topic.registration-validation-requested=auth.registration.validation.requested.v1
app.kafka.topic.registration-validation-result=auth.registration.validation.result.v1
app.kafka.topic.account-verified=auth.account.verified.v1

# ===== Application Security Configuration =====
app.security.default-roles=ADMIN,CUSTOMER


