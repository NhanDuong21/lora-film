####################################################
# PAYMENT SERVICE - CONFIGURATION FILE             #
####################################################
# Huong dan:
# 1) Copy file nay thanh application.properties
# 2) Dien gia tri thuc te theo moi truong local
# 3) Khong push application.properties len git

server.port=8084
spring.application.name=payment-service

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE:payment_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT Configuration =====
jwt.secret=${JWT_SECRET:your_base64_encoded_jwt_secret_key_here_must_be_at_least_256_bits}
jwt.expiration=86400000

# ===== Booking Service Integration =====
booking.service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8083}
booking.service.internal-token=${BOOKING_INTERNAL_TOKEN:your_internal_token_here}
booking.service.connect-timeout=5000
booking.service.read-timeout=10000

# ===== Payment MOCK Provider =====
payment.mock.enabled=${PAYMENT_MOCK_ENABLED:true}
payment.mock.base-url=${PAYMENT_MOCK_BASE_URL:http://localhost:8084}