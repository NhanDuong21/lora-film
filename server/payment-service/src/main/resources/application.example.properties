###############################################
# PAYMENT SERVICE - SAMPLE CONFIGURATION FILE #
###############################################
# Huong dan:
# 1) Copy file nay thanh application.properties
# 2) Dien gia tri thuc te theo moi truong local
# 3) Khong push application.properties len git

# Service port (bat buoc khac cac service khac)
server.port=8084

# Ten service hien thi trong he thong
spring.application.name=payment-service

# ===== Database (MySQL) =====
# Dien ten host, port, database cua ban
spring.datasource.url=jdbc:mysql://localhost:3306/payment_db

# Dien tai khoan MySQL local
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# Thuong de mac dinh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update | validate | create | create-drop
spring.jpa.hibernate.ddl-auto=update

# Bat/tat log SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
