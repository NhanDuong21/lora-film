####################################################
# PAYMENT SERVICE - LOCAL CONFIGURATION EXAMPLE
####################################################

# Hướng dẫn:
# 1. Copy file này thành application.properties nếu team dùng local file.
# 2. Hoặc export các biến môi trường tương ứng.
# 3. Không commit mật khẩu, JWT secret hoặc internal token thật.
# 4. MOCK chỉ bật cho local/test.
# 5. Booking Stub dùng port 8091; Booking Service thật dùng port 8083.

# Cổng của Payment Service (mặc định 8084)
server.port=${SERVER_PORT:8084}
spring.application.name=payment-service

# ===== Database (MySQL) =====
# Mặc định sử dụng cổng 3307 trỏ tới container `movie-booking-mysql`
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE:payment_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# ĐIỀN MẬT KHẨU LOCAL CỦA BẠN VÀO ĐÂY:
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:<YOUR_LOCAL_MYSQL_PASSWORD>}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
# Bật/tắt log câu lệnh SQL
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ===== JWT Configuration =====
# Secret key xác thực JWT (yêu cầu ít nhất 256 bits và trùng khớp với Auth Service / Gateway)
jwt.secret=${JWT_SECRET:<SAME_SECRET_AS_AUTH_SERVICE>}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Booking Service Integration =====
# Chế độ 1: Dùng Real Booking Service
# booking.service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8083}
#
# Chế độ 2: Dùng Temporary Booking Stub
# booking.service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8091}
# Do not run Booking Stub on 8089 because analytics-service uses 8089.
booking.service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8083}

# Internal token dùng để giao tiếp nội bộ giữa các service (trùng với token bên Booking/Stub)
booking.service.internal-token=${PAYMENT_TO_BOOKING_INTERNAL_TOKEN:${BOOKING_INTERNAL_TOKEN:<SAME_PAYMENT_TOKEN_AS_BOOKING_OR_STUB>}}

booking.service.connect-timeout=${BOOKING_CONNECT_TIMEOUT:5000}
booking.service.read-timeout=${BOOKING_READ_TIMEOUT:10000}

# ===== Payment MOCK Provider =====
# Chỉ bật khi chạy local/test để bỏ qua gọi bên thứ 3 thật.
payment.mock.enabled=${PAYMENT_MOCK_ENABLED:false}
payment.mock.base-url=${PAYMENT_MOCK_BASE_URL:http://localhost:8084}
