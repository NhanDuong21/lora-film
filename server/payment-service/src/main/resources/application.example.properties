# LoraFilm Payment Service - local configuration template
# Copy to application.properties or export the equivalent environment variables.
# This private-project example contains local development keys so a fresh clone
# can start immediately. Environment variables may still override every value.

server.port=${SERVER_PORT:8084}
spring.application.name=payment-service

# Discovery
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# MySQL - create payment_db manually with docs/database/mysql/payment-service-schema.sql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:payment_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never
spring.jackson.time-zone=UTC

# Shared JWT and Payment -> Booking service authentication
jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
jwt.expiration=${JWT_EXPIRATION:86400000}
booking.service.base-url=${BOOKING_SERVICE_BASE_URL:http://localhost:8083}
booking.service.internal-token=${PAYMENT_TO_BOOKING_INTERNAL_TOKEN:payment-booking-local-token}
booking.service.connect-timeout=${BOOKING_CONNECT_TIMEOUT:5000}
booking.service.read-timeout=${BOOKING_READ_TIMEOUT:10000}
# Allows small wall-clock differences between Booking and Payment. This is
# validation tolerance only and never extends the Booking payment deadline.
booking.service.max-clock-skew-seconds=${BOOKING_PAYMENT_CONTEXT_MAX_CLOCK_SKEW_SECONDS:5}
# Shared only between Movie Service and Payment Service. Never route this
# internal endpoint through Gateway.
payment.internal-trigger-token=${SHOWTIME_TO_PAYMENT_INTERNAL_TOKEN:showtime-payment-local-token}

# Durable delivery to Analytics. Payment can start while Kafka is unavailable;
# outbox rows remain retryable.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Runtime policy
payment.runtime.frontend-return-url=${PAYMENT_FRONTEND_RETURN_URL:http://localhost:5173/payments/return}
payment.runtime.idempotency-lease-seconds=${PAYMENT_IDEMPOTENCY_LEASE_SECONDS:30}
payment.runtime.idempotency-ttl-seconds=${PAYMENT_IDEMPOTENCY_TTL_SECONDS:3600}
payment.runtime.settlement-hold-seconds=${PAYMENT_SETTLEMENT_HOLD_SECONDS:60}
payment.runtime.trust-verified-browser-return=${PAYMENT_TRUST_VERIFIED_BROWSER_RETURN:false}
payment.runtime.outbox-batch-size=${PAYMENT_OUTBOX_BATCH_SIZE:20}
payment.runtime.outbox-lease-seconds=${PAYMENT_OUTBOX_LEASE_SECONDS:30}
payment.runtime.outbox-max-attempts=${PAYMENT_OUTBOX_MAX_ATTEMPTS:8}
payment.runtime.outbox-fixed-delay-millis=${PAYMENT_OUTBOX_FIXED_DELAY_MILLIS:2000}
payment.runtime.outbox-initial-delay-millis=${PAYMENT_OUTBOX_INITIAL_DELAY_MILLIS:2000}
payment.runtime.provider-recovery-initial-delay-millis=${PAYMENT_PROVIDER_RECOVERY_INITIAL_DELAY_MILLIS:5000}
payment.runtime.expiry-initial-delay-millis=${PAYMENT_EXPIRY_INITIAL_DELAY_MILLIS:5000}
payment.runtime.provider-recovery-fixed-delay-millis=${PAYMENT_PROVIDER_RECOVERY_FIXED_DELAY_MILLIS:5000}
payment.runtime.expiry-fixed-delay-millis=${PAYMENT_EXPIRY_FIXED_DELAY_MILLIS:5000}
payment.runtime.refund-batch-size=${PAYMENT_REFUND_BATCH_SIZE:10}
payment.runtime.refund-lease-seconds=${PAYMENT_REFUND_LEASE_SECONDS:45}
payment.runtime.refund-max-attempts=${PAYMENT_REFUND_MAX_ATTEMPTS:8}
payment.runtime.refund-fixed-delay-millis=${PAYMENT_REFUND_FIXED_DELAY_MILLIS:3000}
# Provider-confirmed PROCESSING is polled separately from transport failures
# and escalates only after the operational SLA expires.
payment.runtime.refund-processing-poll-seconds=${PAYMENT_REFUND_PROCESSING_POLL_SECONDS:60}
payment.runtime.refund-processing-max-age-hours=${PAYMENT_REFUND_PROCESSING_MAX_AGE_HOURS:72}
payment.runtime.analytics-topic=${PAYMENT_ANALYTICS_TOPIC:payment-success.v1}

# VNPay Sandbox
payment.providers.vnpay.enabled=${VNPAY_ENABLED:false}
payment.providers.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.providers.vnpay.hash-secret=${VNPAY_HASH_SECRET:VCWYLADYIWLMKUYSUOPUCOFWRKKZDDUV}
payment.providers.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.providers.vnpay.query-url=${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
payment.providers.vnpay.refund-url=${VNPAY_REFUND_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
payment.providers.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8084/api/payments/return/vnpay}
payment.providers.vnpay.version=2.1.0
payment.providers.vnpay.command=pay
payment.providers.vnpay.order-type=other
payment.providers.vnpay.query-ip-address=${VNPAY_QUERY_IP_ADDRESS:127.0.0.1}
payment.providers.vnpay.connect-timeout-millis=${VNPAY_CONNECT_TIMEOUT_MILLIS:5000}
payment.providers.vnpay.read-timeout-millis=${VNPAY_READ_TIMEOUT_MILLIS:10000}
payment.providers.vnpay.query-retry-delay-seconds=${VNPAY_QUERY_RETRY_DELAY_SECONDS:305}
payment.providers.vnpay.query-retry-max-delay-seconds=${VNPAY_QUERY_RETRY_MAX_DELAY_SECONDS:3600}
# MoMo Sandbox
payment.providers.momo.enabled=${MOMO_ENABLED:false}
payment.providers.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.providers.momo.access-key=${MOMO_ACCESS_KEY:}
payment.providers.momo.secret-key=${MOMO_SECRET_KEY:K951B6PE1waDMi640xX08PD3vg6EkVlz}
payment.providers.momo.create-url=${MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
payment.providers.momo.query-url=${MOMO_QUERY_URL:https://test-payment.momo.vn/v2/gateway/api/query}
payment.providers.momo.refund-url=${MOMO_REFUND_URL:https://test-payment.momo.vn/v2/gateway/api/refund}
payment.providers.momo.refund-query-url=${MOMO_REFUND_QUERY_URL:https://test-payment.momo.vn/v2/gateway/api/refund/query}
payment.providers.momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8084/api/payments/return/momo}
payment.providers.momo.ipn-url=${MOMO_IPN_URL:}
payment.providers.momo.connect-timeout-millis=${MOMO_CONNECT_TIMEOUT_MILLIS:5000}
payment.providers.momo.read-timeout-millis=${MOMO_READ_TIMEOUT_MILLIS:30000}

# MOCK is local/test only and is hidden by the production frontend.
payment.providers.mock.enabled=${PAYMENT_MOCK_ENABLED:false}
payment.providers.mock.base-url=${PAYMENT_MOCK_FRONTEND_URL:http://localhost:5173}
