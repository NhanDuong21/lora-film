# Test configuration for payment-service
# Requires manual execution of docs/database/mysql/payment-service-schema.sql before running tests

spring.application.name=payment-service-test

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.url=${SPRING_DATASOURCE_URL:${TEST_DB_URL:jdbc:mysql://localhost:3307/payment_test?useSSL=false&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${TEST_DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${TEST_DB_PASSWORD:}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===== JWT for tests =====
jwt.secret=${JWT_SECRET:NDQ0RTYzNTI2NjU1NkE1ODZFMzI3MjM1NzUzODc4MkY0MTNGNDQyODQ3MkI0QjYyNTA2NDUzNjc1NjZCNTkyMA==}
jwt.expiration=86400000

# ===== Booking Service Integration (tests use stub) =====
booking.service.base-url=http://localhost:18080
booking.service.internal-token=${INTERNAL_TOKEN:test-internal-token-for-tests}
booking.service.connect-timeout=3000
booking.service.read-timeout=5000

# ===== MOCK Provider enabled for tests =====
payment.mock.enabled=true
payment.mock.base-url=http://localhost:8084
