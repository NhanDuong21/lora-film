# Test configuration for payment-service
# Testcontainers loads the canonical manual DDL through Maven test resources.

spring.application.name=payment-service-test

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.datasource.url=${TEST_DB_URL:jdbc:tc:mysql:8.0.36:///payment_test?TC_INITSCRIPT=payment-service-schema.sql}
spring.datasource.username=${TEST_DB_USERNAME:test}
spring.datasource.password=${TEST_DB_PASSWORD:test}
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# ===== JWT for tests =====
jwt.secret=${JWT_SECRET:NDQ0RTYzNTI2NjU1NkE1ODZFMzI3MjM1NzUzODc4MkY0MTNGNDQyODQ3MkI0QjYyNTA2NDUzNjc1NjZCNTkyMA==}
jwt.expiration=86400000

# ===== Booking Service Integration (tests use stub) =====
booking.service.base-url=http://localhost:8080
booking.service.internal-token=${INTERNAL_TOKEN:test-internal-token-for-tests}
booking.service.connect-timeout=3000
booking.service.read-timeout=5000

# ===== MOCK Provider enabled for tests =====
payment.providers.mock.enabled=true
payment.providers.mock.base-url=http://localhost:5173
payment.providers.vnpay.enabled=false
payment.providers.momo.enabled=false

payment.runtime.frontend-return-url=http://localhost:5173/payments/return
payment.runtime.idempotency-lease-seconds=30
payment.runtime.idempotency-ttl-seconds=3600
payment.runtime.settlement-hold-seconds=60
payment.runtime.outbox-batch-size=20
payment.runtime.outbox-lease-seconds=30
payment.runtime.outbox-max-attempts=8
payment.runtime.outbox-fixed-delay-millis=60000
payment.runtime.outbox-initial-delay-millis=3600000
payment.runtime.provider-recovery-fixed-delay-millis=60000
payment.runtime.provider-recovery-initial-delay-millis=3600000
payment.runtime.expiry-fixed-delay-millis=60000
payment.runtime.expiry-initial-delay-millis=3600000
payment.runtime.analytics-topic=payment-success.v1

spring.kafka.bootstrap-servers=localhost:19092

# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.client.enabled=false
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
