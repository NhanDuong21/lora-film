# Test configuration for payment-service
# Requires manual execution of docs/database/mysql/payment-service-schema.sql before running tests

spring.application.name=payment-service-test

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/payment_test?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
