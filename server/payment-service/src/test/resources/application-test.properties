# Test configuration for payment-service
# Requires manual execution of docs/database/mysql/payment-service-schema.sql before running tests

spring.application.name=payment-service-test

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/payment_test?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:12345678}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===== JWT for tests =====
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# ===== Booking Service Integration (tests use stub) =====
booking.service.base-url=http://localhost:18080
booking.service.internal-token=test-internal-token
booking.service.connect-timeout=3000
booking.service.read-timeout=5000

# ===== MOCK Provider enabled for tests =====
payment.mock.enabled=true
payment.mock.base-url=http://localhost:8084
