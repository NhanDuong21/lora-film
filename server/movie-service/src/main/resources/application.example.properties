#############################################
# MOVIE SERVICE - SAMPLE CONFIGURATION FILE #
#############################################
# Huong dan:
# 1) Copy file nay thanh application.properties
# 2) Dien gia tri thuc te theo moi truong local
# 3) Khong push application.properties len git

server.port=8082
spring.application.name=movie-service

# ===== Eureka Discovery Client =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:movie_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate | create | create-drop
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== Kafka Producer & Consumer =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.internal-token=${INTERNAL_TOKEN:my-secret-internal-token}
