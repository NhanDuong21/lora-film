#############################################
# MOVIE SERVICE - SAMPLE CONFIGURATION FILE #
#############################################
# Instructions:
# 1) Copy this file to application.properties
# 2) Fill in the actual values for the local environment
# 3) Do not push application.properties to git

server.port=8082
spring.application.name=movie-service

# ===== Eureka Discovery Client =====
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:movie_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# ===== JPA / Hibernate =====
# validate | create | create-drop | update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== Security (JWT) =====
jwt.secret=${JWT_SECRET:${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Kafka Producer & Consumer =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ===== OpenAPI / Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ===== Cloudinary Media API =====
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:lorafilm/cinemas}

app.internal-token=${APP_INTERNAL_TOKEN:${INTERNAL_NOTIFICATION_TOKEN:dev-internal-token}}

# Durable Movie -> Payment handoff for automatic full refunds when a showtime
# is cancelled. This internal route must not be exposed by Gateway.
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8084}
payment.service.internal-token=${SHOWTIME_TO_PAYMENT_INTERNAL_TOKEN:showtime-payment-local-token}
payment.service.connect-timeout-millis=${PAYMENT_SERVICE_CONNECT_TIMEOUT_MILLIS:5000}
payment.service.read-timeout-millis=${PAYMENT_SERVICE_READ_TIMEOUT_MILLIS:10000}
payment.refund-outbox.batch-size=${SHOWTIME_REFUND_OUTBOX_BATCH_SIZE:20}
payment.refund-outbox.lease-seconds=${SHOWTIME_REFUND_OUTBOX_LEASE_SECONDS:30}
payment.refund-outbox.max-attempts=${SHOWTIME_REFUND_OUTBOX_MAX_ATTEMPTS:8}
payment.refund-outbox.fixed-delay-millis=${SHOWTIME_REFUND_OUTBOX_FIXED_DELAY_MILLIS:3000}

# ===== TMDB API =====
# ===== TMDB API (New Auto Sync Wrapper) =====
tmdb.base-url=${TMDB_BASE_URL:${TMDB_SERVICE_URL:https://tmdb-api.nyanmovie.site}}
tmdb.api-key=${TMDB_API_KEY:}

# ===== TMDB API (Old Direct API for AdminTmdbController) =====
tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY:}
tmdb.sync-enabled=true
tmdb.batch-size=100
tmdb.scheduler.bulk-interval=30000

# ===== Jackson / JSON =====
spring.jackson.mapper.accept-case-insensitive-enums=true

# ===== Global Location API =====
location.api.base-url=${LOCATION_API_BASE_URL:https://location-api.nyanmovie.site}
location.api.key=${LOCATION_API_KEY:}
location.api.timeout=${LOCATION_API_TIMEOUT:5000}

# Hibernate Batch Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===== Eureka Instance Config (Fix Windows DNS resolution issue) =====
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
