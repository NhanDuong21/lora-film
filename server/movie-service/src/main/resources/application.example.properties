#############################################
# MOVIE SERVICE - SAMPLE CONFIGURATION FILE #
#############################################
# Instructions:
# 1) Copy this file to application.properties
# 2) Fill in the actual values for the local environment
# 3) Do not push application.properties to git

server.port=8082
spring.application.name=movie-service

# ===== Eureka Discovery Client =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===== Database (MySQL) =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:${MYSQL_PORT:3307}}/${MYSQL_DATABASE:movie_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:movieuser}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:moviepassword}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# validate | create | create-drop
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ===== Security (JWT) =====
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Kafka Producer & Consumer =====
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ===== Cloudinary Media API =====
CLOUDINARY_CLOUD_NAME=
CLOUDINARY_API_KEY=
CLOUDINARY_API_SECRET=
CLOUDINARY_FOLDER=lorafilm/cinemas

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ===== OpenAPI / Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

app.internal-token=${INTERNAL_NOTIFICATION_TOKEN:secret-internal-token}

# ===== TMDB API (New Auto Sync Wrapper) =====
tmdb.base-url=${TMDB_BASE_URL:http://localhost:9005}
tmdb.api-key=${TMDB_API_KEY:lorafilm-secret-key}

# ===== TMDB API (Old Direct API for AdminTmdbController) =====
tmdb.api.url=https://api.themoviedb.org/3
tmdb.api.key=${TMDB_API_KEY:lorafilm-secret-key}
tmdb.sync-enabled=true
tmdb.batch-size=100
tmdb.scheduler.bulk-interval=30000

# ===== Jackson / JSON =====
spring.jackson.mapper.accept-case-insensitive-enums=true

# ===== Global Location API =====
location.api.base-url=${LOCATION_API_BASE_URL:https://location-api.nyanmovie.site}
location.api.key=${LOCATION_API_KEY:}
location.api.timeout=${LOCATION_API_TIMEOUT:5000}
