server.port=8080

spring.application.name=api-gateway

# ===== Eureka Discovery Client =====
# Comment out if running standalone without Eureka Server
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# ===== Global CORS Configuration =====
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Idempotency-Key,*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.gateway.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.default-filters[0].args.name=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.default-filters[0].args.strategy=RETAIN_UNIQUE
spring.cloud.gateway.default-filters[1].name=RequestRateLimiter
spring.cloud.gateway.default-filters[1].args.key-resolver=#{@clientKeyResolver}
spring.cloud.gateway.default-filters[1].args.redis-rate-limiter.replenishRate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:20}
spring.cloud.gateway.default-filters[1].args.redis-rate-limiter.burstCapacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:40}
spring.cloud.gateway.default-filters[1].args.redis-rate-limiter.requestedTokens=${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}

# ===== JWT Validation =====
# Must be the same Base64-encoded secret configured in auth-service.
# Base64-encoded, at least 256 bits before encoding; must match Auth/User.
jwt.secret=${JWT_SECRET}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ===== Dynamic Load Balanced Routes (lb://) =====
# Note: In Microservices architecture with Eureka Service Discovery, routes use lb://<service-name>.
# If running dev mode without Eureka Server, replace lb://<service-name> with static URLs (e.g., http://localhost:8081).

# Route 0: auth-service (Port 8081)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /oauth2/**, /login/oauth2/**, /api/roles/**, /api/permissions/**, /api/accounts/**, /api/audits/**

# Route 1: user-service (Port 8086)
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**,/api/admin/user-audits

# Route 2: movie-service (Port 8082)
spring.cloud.gateway.routes[2].id=movie-service
spring.cloud.gateway.routes[2].uri=lb://movie-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/movies/**,/api/genres/**,/api/admin/movies/**,/api/admin/genres/**,/api/admin/rooms/**,/api/admin/seats/**,/api/admin/showtimes/**,/api/admin/pricing/**,/api/showtimes/**,/api/rooms/**,/api/seats/**,/api/cinemas/**,/api/admin/auditoriums/**,/api/admin/seat-types/**,/api/admin/maintenance-windows/**,/api/admin/movie-versions/**,/api/admin/movie-media/**,/api/admin/cinemas/**,/api/customer/movies/**,/api/customer/showtimes/**,/api/customer/genres/**,/api/admin/people/**,/api/admin/production-companies/**,/api/admin/tmdb/**,/api/admin/cinema-media/**,/api/admin/closure-periods/**,/api/admin/showtime-schedules/**

# Route 3: promotion-service (Port 8087)
spring.cloud.gateway.routes[3].id=promotion-service
spring.cloud.gateway.routes[3].uri=lb://promotion-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/promotions/**, /api/admin/promotions/**, /api/admin/promotion-campaigns/**

# Route 4: score-service (Port 8088)
spring.cloud.gateway.routes[4].id=score-service
spring.cloud.gateway.routes[4].uri=lb://score-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/scores/**, /api/admin/scores/**, /api/membership-tiers/**, /api/admin/membership-tiers/**

# Route 5: booking-service (Port 8083)
spring.cloud.gateway.routes[5].id=booking-service
spring.cloud.gateway.routes[5].uri=lb://booking-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/bookings/**,/api/seat-reservations/**,/api/customer/concessions/**,/api/customer/cart/**,/api/admin/bookings/**,/api/admin/monitoring/**,/api/admin/foods/**

# Route 6: payment-service (Port 8084)
spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=lb://payment-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/payments/**,/api/employee/payments/**,/api/admin/payments/**

# Route 7: notification-service (Port 8085)
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://notification-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notifications/**

# Route 8: analytics-service (Port 8089)
spring.cloud.gateway.routes[8].id=analytics-service
spring.cloud.gateway.routes[8].uri=lb://analytics-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/analytics/**, /api/admin/reports/**

# Route 9: tmdb-api (External Movie Metadata Import)
spring.cloud.gateway.routes[9].id=tmdb-api
spring.cloud.gateway.routes[9].uri=${TMDB_SERVICE_URL:https://tmdb-api.nyanmovie.site}
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/import/**,/api/tmdb/**
spring.cloud.gateway.routes[9].filters[0]=AddRequestHeader=x-api-key,${TMDB_API_KEY}
spring.cloud.gateway.routes[9].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_LAST
spring.cloud.gateway.routes[9].filters[2].name=CircuitBreaker
spring.cloud.gateway.routes[9].filters[2].args.name=tmdbImport
spring.cloud.gateway.routes[9].filters[2].args.fallbackUri=forward:/gateway-fallback/tmdb
spring.cloud.gateway.routes[9].filters[2].args.statusCodes=500,502,503,504

# ===== TMDB Circuit Breaker =====
resilience4j.circuitbreaker.instances.tmdbImport.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.tmdbImport.sliding-window-size=${TMDB_CB_SLIDING_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.tmdbImport.minimum-number-of-calls=${TMDB_CB_MINIMUM_CALLS:5}
resilience4j.circuitbreaker.instances.tmdbImport.failure-rate-threshold=${TMDB_CB_FAILURE_RATE_THRESHOLD:50}
resilience4j.circuitbreaker.instances.tmdbImport.wait-duration-in-open-state=${TMDB_CB_OPEN_STATE_WAIT:30s}
resilience4j.circuitbreaker.instances.tmdbImport.permitted-number-of-calls-in-half-open-state=${TMDB_CB_HALF_OPEN_CALLS:3}
resilience4j.circuitbreaker.instances.tmdbImport.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.tmdbImport.timeout-duration=${TMDB_TIMEOUT:5s}
resilience4j.timelimiter.instances.tmdbImport.cancel-running-future=true

# Route 10: global-location-api
spring.cloud.gateway.routes[10].id=global-location-api
spring.cloud.gateway.routes[10].uri=lb://global-location-api
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/address/**,/api/v1/geocode/**

# Socket.IO seat availability channel. The client uses WebSocket transport so
# the Gateway can forward the upgrade to Booking's Socket.IO listener.
spring.cloud.gateway.routes[11].id=booking-seat-socket
spring.cloud.gateway.routes[11].uri=${BOOKING_SOCKET_URI:ws://localhost:9093}
spring.cloud.gateway.routes[11].predicates[0]=Path=/socket.io/**

# ===== Eureka Instance Config =====
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:127.0.0.1}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
