server.port=8080

spring.application.name=api-gateway

# ===== Eureka Discovery Client =====
# Comment out if running standalone without Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===== Global CORS Configuration =====
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173,http://localhost:5174
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Idempotency-Key,*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.gateway.default-filters[0].name=DedupeResponseHeader
spring.cloud.gateway.default-filters[0].args.name=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.default-filters[0].args.strategy=RETAIN_UNIQUE

# ===== Dynamic Load Balanced Routes (lb://) =====
# Note: In Microservices architecture with Eureka Service Discovery, routes use lb://<service-name>.
# If running dev mode without Eureka Server, replace lb://<service-name> with static URLs (e.g., http://localhost:8081).

# Route 0: auth-service (Port 8081)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 1: user-service (Port 8086)
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

# Route 2: movie-service (Port 8082)
spring.cloud.gateway.routes[2].id=movie-service
spring.cloud.gateway.routes[2].uri=lb://movie-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/movies/**,/api/genres/**,/api/admin/movies/**,/api/admin/genres/**,/api/admin/rooms/**,/api/admin/seats/**,/api/admin/showtimes/**,/api/showtimes/**,/api/rooms/**,/api/seats/**,/api/cinemas/**,/api/admin/auditoriums/**,/api/admin/seat-types/**,/api/admin/maintenance-windows/**,/api/admin/movie-versions/**,/api/admin/movie-media/**,/api/admin/cinemas/**,/api/customer/movies/**,/api/customer/genres/**,/api/admin/people/**,/api/admin/production-companies/**,/api/admin/tmdb/**

# Route 3: promotion-service (Port 8087)
spring.cloud.gateway.routes[3].id=promotion-service
spring.cloud.gateway.routes[3].uri=lb://promotion-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/promotions/**, /api/admin/promotions/**, /api/admin/promotion-campaigns/**

# Route 4: score-service (Port 8088)
spring.cloud.gateway.routes[4].id=score-service
spring.cloud.gateway.routes[4].uri=lb://score-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/scores/**, /api/admin/scores/**

# Route 5: booking-service (Port 8083)
spring.cloud.gateway.routes[5].id=booking-service
spring.cloud.gateway.routes[5].uri=lb://booking-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/bookings/**, /api/tickets/**, /api/admin/bookings/**

# Route 6: payment-service (Port 8084)
spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=lb://payment-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/payments/**, /api/vnpay/**

# Route 7: notification-service (Port 8085)
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://notification-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notifications/**

# Route 8: analytics-service (Port 8089)
spring.cloud.gateway.routes[8].id=analytics-service
spring.cloud.gateway.routes[8].uri=lb://analytics-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/analytics/**, /api/admin/reports/**

# Route 9: tmdb-api (External Movie Metadata Import)
spring.cloud.gateway.routes[9].id=tmdb-api
spring.cloud.gateway.routes[9].uri=https://tmdb-api.nyanmovie.site
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/import/**
spring.cloud.gateway.routes[9].filters[0]=AddRequestHeader=x-api-key,lorafilm-secret-key
spring.cloud.gateway.routes[9].filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_LAST
