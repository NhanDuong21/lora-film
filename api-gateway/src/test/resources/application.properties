spring.application.name=api-gateway-test
server.port=0

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
TMDB_API_KEY=test-key
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cloud.gateway.default-filters[0].name=RequestRateLimiter
spring.cloud.gateway.default-filters[0].args.key-resolver=#{@clientKeyResolver}
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.replenishRate=20
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.burstCapacity=40
spring.cloud.gateway.default-filters[0].args.redis-rate-limiter.requestedTokens=1

spring.cloud.gateway.routes[0].id=tmdb-test
spring.cloud.gateway.routes[0].uri=https://example.test
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/import/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=tmdbImport
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/gateway-fallback/tmdb
spring.cloud.gateway.routes[0].filters[0].args.statusCodes=500,502,503,504

resilience4j.circuitbreaker.instances.tmdbImport.sliding-window-size=10
resilience4j.circuitbreaker.instances.tmdbImport.minimum-number-of-calls=5
resilience4j.timelimiter.instances.tmdbImport.timeout-duration=5s
